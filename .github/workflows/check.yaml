name: Check (lint, build and test)

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # The declared Node floor; the example units run the current release.
          node-version: 22.19.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Run pnpm check
        run: pnpm check
      # The interface bundle the gate just built is the production release candidate;
      # only a push to the default branch carries it forward to the deploy job.
      - if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: interface/dist

  # Every merge to the default branch is a production release of the interface at
  # ickb.org (decisions amendment 52(ab)). It deploys only after the gate passed on the
  # same commit; a failed run leaves the previous deployment live.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
