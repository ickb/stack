packages:
  - sdk
  - sdk/node
  - testkit
  - interface

audit:
  ignore:
    # Unpatched upstream: @joyid/ckb -> @nervosnetwork/ckb-sdk-utils -> elliptic
    # (CVE-2025-14505; pnpm 11+ filters by GHSA only).
    - GHSA-848j-6mx2-7j84
    # No patched version exists. image-size sits under Metro, React Native's build tool,
    # pulled in by @ckb-ccc/connector 2.x through @libp2p/webrtc -> react-native-webrtc; it
    # never runs in the browser bundle.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # No patched version exists. braces sits under the same React Native chain.
    - GHSA-vfj7-8cjw-p6xm
    # No patched version exists. sprintf-js sits under @microsoft/api-extractor's argparse,
    # a build-time tool that only parses its own command line.
    - GHSA-hp3w-g68c-fv3c

overrides:
  # Security pins for vulnerable transitive ranges not yet lifted by upstreams.
  axios@>=1.0.0 <1.20.0: 1.20.0
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  esbuild@>=0.27.3 <0.28.1: 0.28.1
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  follow-redirects@>=1.16.0 <1.16.1: 1.16.1
  form-data@>=4.0.0 <4.0.6: 4.0.6
  nanoid@<3.3.18: 3.3.18
  shell-quote@>=1.8.4 <1.11.0: 1.11.0
  smol-toml@<1.9.0: 1.9.0
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  ws@>=8.0.0 <8.21.1: 8.21.1
  zod@<4.6.6: 4.6.6
  # eslint-plugin-react-hooks imports this subpath, but pnpm can otherwise pick
  # 3.5.4 from its union range, which does not export `zod-validation-error/v4`.
  zod-validation-error@^3.5.0 || ^4.0.0: 4.0.2
  # Keep CCC React connector on the app's React instance; otherwise pnpm may
  # auto-install a second peer copy and React hooks fail at runtime.
  "@ckb-ccc/connector-react>react": 19.3.0

catalog:
  "@ckb-ccc/ccc": ^1.3.6
  "@ckb-ccc/connector-react": ^2.2.2
  "@ckb-ccc/core": ^1.23.0
  "@types/node": ~22.20.4

# Three days. A freshly published release cannot be installed until it matures, so a
# compromised one has time to be caught; the wait is also how long a fix stays
# unadopted, and three days is what a pulled or regressed release needs to show (user
# decision 2026-10-25, back from the seven days chosen on 2026-09-14).
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
# A package whose registry metadata has no publish time fails resolution instead of
# skipping the age check, which pnpm has done by default since 11.
minimumReleaseAgeIgnoreMissingTime: false

patchedDependencies:
  # JoyID only needs a standard fetch implementation, but 1.1.4 imports
  # cross-fetch, which loads node-fetch@2 and Node's deprecated builtin
  # punycode during native source imports. Stack requires Node 22.23.4+ and
  # modern browsers, so use globalThis.fetch until JoyID publishes this fix.
  # pnpm still resolves JoyID's original cross-fetch dependency in the lockfile;
  # scripts/test/build/native-source-smoke.ts guards the runtime path so it stays dormant.
  "@joyid/ckb@1.1.4": patches/@joyid__ckb@1.1.4.patch
# pnpm 12 refuses unreviewed build scripts. Neither is needed: esbuild runs from its
# platform package and core-js's postinstall only prints a funding notice; both were
# ignored with a warning under pnpm 10 and the gate was green.
allowBuilds:
  core-js: false
  esbuild: false
